# Overrides on top of detekt's default rules. Compose UI functions are named like types and take many
# parameters by design, so those naming and size rules are relaxed for @Composable code.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 160
  WildcardImport:
    active: false
