name: Engineering regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The default package list includes the removed 'tools' package, which makes sdkmanager fail.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: python tools/check_module_boundaries.py
      - run: ./gradlew.bat --console=plain --no-daemon verifyEngineering
      - run: python tools/check_schema_migrations.py
      - run: python -m unittest discover -s tools -p 'test_coach_evaluation*.py'
      - run: git diff --exit-code -- app/schemas
