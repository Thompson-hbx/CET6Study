name: Android regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew.bat --console=plain --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - run: python tools/check_schema_migrations.py
      - run: python -m unittest discover -s tools -p 'test_coach_evaluation*.py'
      - run: git diff --exit-code -- app/schemas
